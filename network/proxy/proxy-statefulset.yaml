apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: proxy
  namespace: tfb-network
  labels:
    run: proxy
    backstage.io/kubernetes-id: proxy
spec:
  serviceName: "proxy"
  replicas: 1
  selector:
    matchLabels:
      run: proxy
  template:
    metadata:
      labels:
        run: proxy
        backstage.io/kubernetes-id: proxy
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      nodeSelector:
        "kubernetes.io/hostname": bm-tfb-cluster-2675687
      containers:
      - name: proxy
        image: forge.theflyingbirds.net/tfb/proxy:latest
        env:
          - name: TYPE
            value: "CUSTOM"
          - name: BUNGEE_JAR_FILE
            value: "/server/server.jar"
          - name: CUSTOM_FAMILY
            value: "waterfall"
          - name: EULA
            value: "TRUE"
        ports:
          - containerPort: 25565
            hostPort: 25565
          - containerPort: 8804
          - containerPort: 8192
        command: ["/bin/sh", "-c"]
        args: ["apt-get update && apt-get install -y screen && screen -dmS minecraft /usr/bin/run-bungeecord.sh && tail -f /dev/null"]
        securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
        volumeMounts:
          - name: proxy-pv
            mountPath: /data/logs
        resources:
          requests:
            memory: "4Gi"
        livenessProbe:
          tcpSocket:
            port: 25565
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 25565
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 2
        startupProbe:
          tcpSocket:
            port: 25565
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
      imagePullSecrets:
        - name: regcred
  volumeClaimTemplates:
  - metadata:
      name: proxy-pv
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi